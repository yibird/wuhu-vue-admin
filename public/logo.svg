      fill="url(#cool-ribbon)"
    />
    <path
      d="M229 260C220 241 228 218 247 208C266 198 289 206 299 226L332 298L318 346L263 242C250 236 238 243 229 260Z"
      fill="url(#center-flash)"
    />
    <path
      d="M82 100L164 385C168 399 176 406 188 407"
