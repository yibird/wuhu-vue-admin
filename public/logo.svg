<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 28 448 436" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Wuhu Admin Logo</title>
  <desc id="desc">Two interlocking color ribbons form a rising W on a transparent background.</desc>
  <defs>
    <linearGradient id="warm-ribbon" x1="70" y1="78" x2="250" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF3D71" />
      <stop offset="0.54" stop-color="#FF6B35" />
      <stop offset="1" stop-color="#FFB800" />
    </linearGradient>
    <linearGradient id="cool-ribbon" x1="244" y1="426" x2="448" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D5DFC" />
      <stop offset="0.48" stop-color="#00B8F0" />
      <stop offset="1" stop-color="#00E0B8" />
    </linearGradient>
    <linearGradient id="center-flash" x1="220" y1="206" x2="316" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.62" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="logo-shadow" x="24" y="20" width="464" height="452" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
  </defs>

  <g filter="url(#logo-shadow)">
    <path
