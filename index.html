<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/svg/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_NAME%</title>
    <script>
      ;(() => {
        const root = document.documentElement

        try {
          const state = JSON.parse(localStorage.getItem('app') || '{}')
          const config = state?.app
          const channels = String(config?.themeColor || '')
            .split(',')
            .slice(0, 3)
            .map((value) => Number(value.trim()))

          if (
            channels.length === 3 &&
            channels.every(
              (value) => Number.isFinite(value) && value >= 0 && value <= 255
            )
          ) {
            const primaryColor = channels.join(' ')
            root.style.setProperty('--app-loading-primary-rgb', primaryColor)
            root.style.setProperty('--w-color-primary', primaryColor)
          }

          const isDark =
            config?.themeMode === 'dark' ||
            (config?.themeMode === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.dataset.theme = isDark ? 'dark' : 'light'
          root.style.colorScheme = isDark ? 'dark' : 'light'
        } catch {}
      })()
    </script>
    <style id="app-loading-style">
      :root {
        --app-loading-primary-rgb: 24 144 255;
        --app-loading-page-rgb: 245 247 250;
        --app-loading-text-rgb: 31 41 55;
        --app-loading-gradient-strong: 14%;
        --app-loading-gradient-soft: 7%;
      }

      :root[data-theme='dark'] {
        --app-loading-page-rgb: 15 23 42;
        --app-loading-text-rgb: 248 250 252;
        --app-loading-gradient-strong: 20%;
        --app-loading-gradient-soft: 10%;
      }

      #app-loading {
        --app-loading-primary: rgb(var(--app-loading-primary-rgb));
        --app-loading-text: rgb(var(--app-loading-text-rgb));

        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(
            145deg,
            rgb(
                var(--app-loading-primary-rgb) /
                  var(--app-loading-gradient-strong)
              )
              0%,
            transparent 48%
          ),
          linear-gradient(
            325deg,
            rgb(
                var(--app-loading-primary-rgb) /
                  var(--app-loading-gradient-soft)
              )
              0%,
            transparent 42%
          ),
          rgb(var(--app-loading-page-rgb));
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          Arial,
          sans-serif;
        opacity: 1;
        visibility: visible;
        pointer-events: none;
        transition:
          opacity 220ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 220ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #app-loading.app-loading--hidden {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.02);
      }

      .app-loading__loader {
        position: relative;
        width: 64px;
        height: 64px;
      }

      .app-loading__loader::before,
      .app-loading__loader::after {
        position: absolute;
        left: 0;
        content: '';
      }

      .app-loading__loader::before {
        top: 90px;
        left: 4px;
        width: 56px;
        height: 6px;
        background: var(--app-loading-primary);
        border-radius: 50%;
        transform-origin: center;
        animation: app-loading-ground 0.58s ease-in-out infinite;
      }

      .app-loading__loader::after {
        inset: 0;
        border-radius: 12px;
        background:
          linear-gradient(135deg, rgb(255 255 255 / 35%), transparent 45%),
          var(--app-loading-primary);
        box-shadow:
          0 8px 20px rgb(var(--app-loading-primary-rgb) / 18%),
          inset 0 1px 0 rgb(255 255 255 / 30%);
        animation: app-loading-beat 0.55s ease-in-out infinite;
      }

      .app-loading__title {
        margin-top: 68px;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--app-loading-text);
        letter-spacing: 0;
      }

      @keyframes app-loading-beat {
        0% {
          transform: translateY(0) rotate(0deg);
        }

        25% {
          transform: translateY(6px) rotate(22.5deg);
        }

        50% {
          transform: translateY(12px) scaleY(0.94) rotate(45deg);
        }

        75% {
          transform: translateY(6px) rotate(67.5deg);
        }

        100% {
          transform: translateY(0) rotate(90deg);
        }
      }
      @keyframes app-loading-ground {
        0%,
        100% {
          opacity: 0.32;
          transform: scaleX(0.9);
        }
        50% {
          opacity: 0.12;
          transform: scaleX(1.2);
        }
      }
    </style>
  </head>

  <body>
    <div
      id="app-loading"
      role="status"
      aria-live="polite"
      aria-label="%VITE_APP_NAME% Loading"
    >
      <div class="app-loading__loader" aria-hidden="true"></div>
      <div class="app-loading__title">%VITE_APP_NAME%</div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
